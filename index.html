<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <header>
    <div class="contenedor">
    <div class="encabezado">
      <div class="logo">
        <img src="./img/VectorPizza.svg" alt="Logo Pizza">
        <h1>
          <span class="pizza">Pizza</span>
          <span class="y">&</span>
          <span class="front">Front</span>
        </h1>
      </div>

      <nav class="listado">
        <ul>
          <li>Home</li>
          <li>Ranking</li>
          <li>Promoción</li>
          <li>Contacto</li>
        </ul>
      </nav>
    </div>
  </div>
  </header>
  <body>
    <main>
    <section class="contenedor_cuerpo">
  <div class="caja-1">
    <div class="izquierda">
      <img src="./img/repartidor.jpg" alt="Repartidor en moto">
      <h2>
        <span class="rojo">Envío Gratis</span>
        <span class="blanco">comprando</span>
        <span class="rojo2">2 pizzas</span>
      </h2>
    </div>

    <div class="derecha">
      <h2 class="rojo">Podio de pizzas</h2>
      <h3>Pizzas top 5</h3>
      <ol class="lista">
        <li>Muzzarella</li>
        <li>Hawaiana</li>
        <li>Muzzarella J&Morron</li>
        <li>Fugazzeta</li>
        <li>Calabresa</li>
      </ol>
      <img src="./img/vegetales.png" class="vegetales" alt="Montaña de vegetales">
    </div>
  </div>
</section>
    </main>
    <footer>
    <div class="izquierda-footer">
    <nav class="listado_pie">
      <ul>
        <li>Home</li>
        <li>Ranking</li>
        <li>Promoción</li>
        <li>Contacto</li>
      </ul>
    </nav>
  </div>

  <div class="derecha-footer">
    <img src="./img/VectorPizza.svg" alt="Logo Pizza">
    <h2>
      <span class="pizza">Pizza</span>
      <span class="y">&</span>
      <span class="front">Front</span>
    </h2>
  </div>
    </footer>
  </body>
</html>
